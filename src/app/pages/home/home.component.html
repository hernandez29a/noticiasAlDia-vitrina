<div *ngIf="isLoading()" class="flex justify-center items-center py-32">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
</div>

<div *ngIf="!isLoading()" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
  <!-- Left Column (Main News) -->
  <div class="lg:col-span-8 flex flex-col gap-10">
    <app-hero-article *ngIf="featuredArticle()" [article]="featuredArticle()"></app-hero-article>
    
    <div class="border-t border-outline-variant/30 pt-8">
      <h2 class="text-2xl font-display font-bold mb-6 text-primary">Más Leídas</h2>
      <app-news-grid [news]="gridNews()"></app-news-grid>
    </div>
  </div>

  <!-- Right Column (Sidebar / Latest) -->
  <div class="lg:col-span-4 border-l border-outline-variant/30 pl-0 lg:pl-8">
    <app-latest-news [news]="latestNews()"></app-latest-news>
  </div>
</div>
