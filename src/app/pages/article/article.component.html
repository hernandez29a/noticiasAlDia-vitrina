<div *ngIf="isLoading()" class="flex justify-center items-center py-32">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
</div>

<!-- Sticky Back Button -->
<div *ngIf="!isLoading() && article()" class="sticky top-16 z-40 bg-white/95 backdrop-blur-md py-4 border-b border-outline-variant/30 shadow-sm transition-all px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto flex items-center">
    <a routerLink="/" class="text-primary hover:text-blue-700 transition-colors flex items-center gap-2 text-sm font-bold bg-white/80 rounded-full px-4 py-2 w-fit shadow-sm border border-outline-variant/20">
      &larr; Volver a la portada
    </a>
  </div>
</div>

<article *ngIf="!isLoading() && article()" class="max-w-4xl mx-auto py-8 px-4 mt-2">
  <div class="mb-8">
    <span class="bg-tertiary-fixed text-on-tertiary-fixed text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-sm shadow-sm mb-4 inline-block">
      {{ article().categories || 'Noticias' }}
    </span>
    
    <h1 class="text-4xl md:text-5xl lg:text-6xl font-display font-bold text-primary mb-6 leading-tight">
      {{ article().title }}
    </h1>
    
    <div class="flex items-center text-on-surface-variant text-sm font-medium border-b border-outline-variant/30 pb-6 mb-8">
      <span class="font-bold flex items-center gap-1">
          <span *ngIf="article().is_ai_generated" class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
          {{ article().is_ai_generated ? 'Generado por Robot' : 'Escrito por Redacción' }}
      </span>
      <span class="mx-3">•</span>
      <span>{{ article().published_at | date:'longDate' }}</span>
    </div>
  </div>

  <div class="w-full h-[400px] md:h-[600px] overflow-hidden rounded-2xl shadow-md mb-10">
    <img [src]="article().cover_image_url || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=1200&q=80'" alt="{{ article().title }}" class="w-full h-full object-cover">
  </div>

  <div class="prose prose-lg md:prose-xl max-w-none prose-headings:font-display prose-a:text-blue-600 hover:prose-a:text-blue-800 text-on-surface leading-relaxed" [innerHTML]="article().content">
  </div>
</article>

<div *ngIf="!isLoading() && !article()" class="text-center py-32">
  <h2 class="text-2xl font-bold text-primary">Artículo no encontrado</h2>
  <a routerLink="/" class="text-blue-600 mt-4 inline-block hover:underline">Volver al inicio</a>
</div>
