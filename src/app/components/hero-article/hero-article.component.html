<div class="relative group cursor-pointer overflow-hidden rounded-xl shadow-sm border border-outline-variant/20" *ngIf="article">
  <!-- Image -->
  <div class="w-full h-[400px] sm:h-[500px] overflow-hidden">
    <img [src]="article.image" alt="{{ article.title }}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
  </div>
  <!-- Overlay -->
  <div class="absolute inset-0 bg-gradient-to-t from-primary via-primary/40 to-transparent opacity-90 group-hover:opacity-100 transition-opacity duration-500"></div>
  
  <!-- Content -->
  <div class="absolute bottom-0 left-0 w-full p-6 sm:p-10">
    <div class="mb-4">
      <span class="bg-tertiary-fixed text-on-tertiary-fixed text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-sm shadow-sm">{{ article.category }}</span>
    </div>
    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-display font-bold text-white mb-4 leading-tight group-hover:text-blue-100 transition-colors">
      {{ article.title }}
    </h1>
    <p class="text-white/80 text-lg hidden sm:block max-w-3xl mb-4 leading-relaxed">
      {{ article.summary }}
    </p>
    <div class="flex items-center text-white/60 text-sm font-medium">
      <span>Por <strong class="text-white/90">{{ article.author }}</strong></span>
      <span class="mx-2">•</span>
      <span>{{ article.timestamp | date:'mediumDate' }}</span>
    </div>
  </div>
</div>
