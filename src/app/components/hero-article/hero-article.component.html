<div class="relative group cursor-pointer overflow-hidden rounded-xl shadow-sm border border-outline-variant/20" *ngIf="article" [routerLink]="['/', article.slug]">
  <!-- Image -->
  <div class="w-full h-[400px] sm:h-[500px] overflow-hidden">
    <img [src]="article.cover_image_url || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=1200&q=80'" alt="{{ article.title }}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
  </div>
  <!-- Overlay -->
  <div class="absolute inset-0 bg-gradient-to-t from-primary via-primary/40 to-transparent opacity-90 group-hover:opacity-100 transition-opacity duration-500"></div>
  
  <!-- Content -->
  <div class="absolute bottom-0 left-0 w-full p-6 sm:p-10">
    <div class="mb-4">
      <span class="bg-tertiary-fixed text-on-tertiary-fixed text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-sm shadow-sm">{{ article.categories || 'Destacado' }}</span>
    </div>
    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-display font-bold text-white mb-4 leading-tight group-hover:text-blue-100 transition-colors line-clamp-3">
      {{ article.title }}
    </h1>
    <div class="flex items-center text-white/60 text-sm font-medium">
        <span class="font-bold flex items-center gap-1 text-white/90">
            <span *ngIf="article.is_ai_generated" class="w-2 h-2 rounded-full bg-blue-500 inline-block"></span>
            {{ article.is_ai_generated ? 'Robot' : 'Redacción' }}
        </span>
      <span class="mx-2">•</span>
      <span>{{ article.published_at | date:'mediumDate' }}</span>
    </div>
  </div>
</div>
